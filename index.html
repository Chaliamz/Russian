<title>Русский Тренажёр</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Unbounded:wght@600;800&display=swap">
<style>
:root{
  --paper:#E8E6DF; --panel:#F3F1EC; --raise:#FBFAF7;
  --ink:#16181D; --ink2:#4A4E57; --ink3:#7C818C;
  --line:#CFCBC1; --line2:#DEDAD1;
  --red:#C22A20; --blue:#234E7D; --ochre:#A97518; --green:#2C7A57;
  --redwash:#F6E3E0; --bluewash:#E0E7F0; --greenwash:#DDEDE4; --ocwash:#F3E9D5;
  --d-xl:clamp(2rem,5vw,3rem); --d-l:clamp(1.4rem,3vw,1.9rem);
  --ru-xl:clamp(1.7rem,4.4vw,2.6rem); --ru-l:clamp(1.25rem,2.6vw,1.6rem);
  --gap:1rem; --rad:3px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#101216; --panel:#191C22; --raise:#20242C;
    --ink:#E7E5DE; --ink2:#A7ABB4; --ink3:#71767F;
    --line:#2A2E37; --line2:#232830;
    --red:#FF6152; --blue:#7FAAE0; --ochre:#D9A63F; --green:#4FC48C;
    --redwash:#2E1B1A; --bluewash:#17222F; --greenwash:#14261F; --ocwash:#2A2214;
  }
}
:root[data-theme="dark"]{
  --paper:#101216; --panel:#191C22; --raise:#20242C;
  --ink:#E7E5DE; --ink2:#A7ABB4; --ink3:#71767F;
  --line:#2A2E37; --line2:#232830;
  --red:#FF6152; --blue:#7FAAE0; --ochre:#D9A63F; --green:#4FC48C;
  --redwash:#2E1B1A; --bluewash:#17222F; --greenwash:#14261F; --ocwash:#2A2214;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  font-size:15px; line-height:1.55; -webkit-text-size-adjust:100%;
}
h1,h2,h3{font-family:"Unbounded","Arial Black",system-ui,sans-serif;font-weight:800;text-wrap:balance;margin:0;letter-spacing:-.01em}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}

/* ── shell ────────────────────────────────────────── */
#shell{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100vh}
#rail{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column}
#brand{padding:18px 18px 14px;border-bottom:1px solid var(--line);position:relative;overflow:hidden}
#brand::after{content:"";position:absolute;right:-30px;top:-40px;width:90px;height:150px;background:var(--red);transform:rotate(24deg);opacity:.13}
#brand h1{font-size:1.05rem;line-height:1.15;position:relative}
#brand .sub{font-size:.66rem;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);margin-top:6px;position:relative}
nav{display:flex;flex-direction:column;padding:8px 0;flex:1}
nav button{
  display:flex;align-items:baseline;gap:9px;background:none;border:0;border-left:3px solid transparent;
  padding:8px 16px;text-align:left;cursor:pointer;color:var(--ink2);width:100%;
}
nav button .n{font-family:"IBM Plex Mono",monospace;font-size:.7rem;color:var(--ink3);min-width:15px}
nav button .t{font-weight:500;font-size:.93rem}
nav button .badge{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:.7rem;background:var(--red);color:#fff;border-radius:9px;padding:0 6px;line-height:16px}
nav button:hover{color:var(--ink);background:var(--line2)}
nav button[aria-current="true"]{color:var(--ink);border-left-color:var(--red);background:var(--raise)}
nav button[aria-current="true"] .t{font-weight:600}
#railfoot{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}

main{min-width:0;display:flex;flex-direction:column}
#topbar{
  display:flex;gap:22px;align-items:center;padding:11px 26px;border-bottom:1px solid var(--line);
  background:var(--panel);flex-wrap:wrap;position:sticky;top:0;z-index:5
}
.stat{display:flex;flex-direction:column;line-height:1.1}
.stat .k{font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.stat .v{font-family:"IBM Plex Mono",monospace;font-size:1.05rem;font-weight:500;font-variant-numeric:tabular-nums}
.stat .v.hot{color:var(--red)}
#voicewarn{margin-left:auto;font-size:.72rem;color:var(--ochre);max-width:280px}
#wrap{padding:26px;max-width:900px;width:100%}
.panel{display:none}
.panel.on{display:block}
.eyebrow{font-size:.62rem;letter-spacing:.17em;text-transform:uppercase;color:var(--red);font-weight:600;font-family:"IBM Plex Mono",monospace}
h2.sect{font-size:var(--d-l);margin:4px 0 4px}
.lede{color:var(--ink2);max-width:64ch;margin:0 0 20px}
.rule{height:1px;background:var(--line);border:0;margin:24px 0}

/* ── buttons ──────────────────────────────────────── */
.btn{background:var(--ink);color:var(--paper);border:1px solid var(--ink);padding:8px 15px;border-radius:var(--rad);cursor:pointer;font-weight:500;font-size:.88rem}
.btn:hover{opacity:.86}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--line2);opacity:1}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.sm{padding:4px 10px;font-size:.78rem}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}

/* ── cards / drill stage ──────────────────────────── */
.stage{
  background:var(--raise);border:1px solid var(--line);border-radius:var(--rad);
  padding:26px;display:flex;flex-direction:column;gap:16px;min-height:230px;justify-content:center;text-align:center
}
.stage.flash-ok{border-color:var(--green);background:var(--greenwash)}
.stage.flash-no{border-color:var(--red);background:var(--redwash)}
.ru{font-size:var(--ru-xl);line-height:1.25;font-weight:500;letter-spacing:-.005em}
.ru.sm{font-size:var(--ru-l)}
.en{color:var(--ink2);font-size:1.02rem}
.tagline{font-size:.66rem;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);font-family:"IBM Plex Mono",monospace}
.note{font-size:.85rem;color:var(--ochre);max-width:56ch;margin:0 auto}
.answerline{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
input[type=text]{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--rad);padding:9px 12px;
  min-width:min(340px,72vw);font-size:1.05rem
}
input[type=text].ru-in{font-size:1.15rem}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:4px}
.grades button{padding:9px 4px;border:1px solid var(--line);background:var(--panel);border-radius:var(--rad);cursor:pointer;display:flex;flex-direction:column;gap:2px;align-items:center}
.grades button:hover{background:var(--line2)}
.grades .lab{font-weight:600;font-size:.84rem}
.grades .iv{font-family:"IBM Plex Mono",monospace;font-size:.68rem;color:var(--ink3)}
.grades button[data-g="0"] .lab{color:var(--red)}
.grades button[data-g="3"] .lab{color:var(--green)}
.verdict{font-weight:600}
.verdict.ok{color:var(--green)} .verdict.no{color:var(--red)} .verdict.near{color:var(--ochre)}
.progress{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:14px}
.progress i{display:block;height:100%;background:var(--red);transition:width .25s}

/* ── choice grid (decoder) ────────────────────────── */
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;max-width:520px;margin:0 auto;width:100%}
.choices button{padding:11px;border:1px solid var(--line);background:var(--panel);border-radius:var(--rad);cursor:pointer;font-size:.95rem}
.choices button:hover{background:var(--line2)}
.choices button.right{background:var(--greenwash);border-color:var(--green)}
.choices button.wrong{background:var(--redwash);border-color:var(--red)}

/* ── lists & tables ───────────────────────────────── */
.plan{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--rad);overflow:hidden;background:var(--raise)}
.plan .blk{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line2);cursor:pointer}
.plan .blk:last-child{border-bottom:0}
.plan .blk:hover{background:var(--panel)}
.plan .min{font-family:"IBM Plex Mono",monospace;font-size:.8rem;color:var(--red);font-weight:500}
.plan .what b{display:block;font-weight:600}
.plan .what span{font-size:.83rem;color:var(--ink2)}
.plan .tick{width:19px;height:19px;border:1px solid var(--line);border-radius:2px;display:grid;place-items:center;font-size:.8rem;color:transparent;background:var(--panel)}
.plan .blk.done .tick{background:var(--green);border-color:var(--green);color:#fff}
.plan .blk.done .what b{text-decoration:line-through;color:var(--ink3)}

table{width:100%;border-collapse:collapse;font-size:.87rem}
.scroller{overflow-x:auto;border:1px solid var(--line);border-radius:var(--rad);background:var(--raise)}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line2);vertical-align:top}
th{font-size:.62rem;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);font-weight:600;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
td.lv{font-family:"Unbounded",sans-serif;font-weight:600;color:var(--red);white-space:nowrap}

.dlg{display:flex;flex-direction:column;gap:2px}
.line{display:grid;grid-template-columns:26px 1fr;gap:10px;padding:9px 12px;border-left:2px solid transparent;border-radius:var(--rad)}
.line.a{background:var(--bluewash);border-left-color:var(--blue)}
.line.b{background:var(--panel);border-left-color:var(--line)}
.line .who{font-family:"IBM Plex Mono",monospace;font-size:.72rem;color:var(--ink3);padding-top:3px}
.line .ru{font-size:1.05rem;text-align:left;font-weight:500}
.line .tr{font-size:.85rem;color:var(--ink2)}
.line .tr.hide{filter:blur(4.5px);cursor:pointer;user-select:none}
.line .sp{background:none;border:0;cursor:pointer;color:var(--ink3);font-size:.8rem;padding:0}
.line .sp:hover{color:var(--red)}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:.74rem;padding:3px 9px;border:1px solid var(--line);border-radius:99px;background:var(--panel);cursor:pointer;color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.pill{font-size:.66rem;font-family:"IBM Plex Mono",monospace;padding:2px 7px;border-radius:99px;white-space:nowrap}
.pill.crit{background:var(--redwash);color:var(--red)}
.pill.warn{background:var(--ocwash);color:var(--ochre)}
.pill.good{background:var(--greenwash);color:var(--green)}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.box{border:1px solid var(--line);border-radius:var(--rad);padding:14px 16px;background:var(--raise)}
.box h3{font-size:.95rem;margin-bottom:6px}
.box p{margin:0;color:var(--ink2);font-size:.88rem}
.kv{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid var(--line2);font-size:.88rem}
.kv:last-child{border-bottom:0}
.pat{border-left:2px solid var(--red);padding:2px 0 2px 12px;margin:12px 0}
.pat .p{font-size:1.15rem;font-weight:500}
.pat .g{font-size:.83rem;color:var(--ink2)}
.empty{color:var(--ink3);font-style:italic;padding:18px 0}
.sw{background:none;border:0;cursor:pointer;color:var(--ink3);font-size:1rem;padding:2px 5px;border-radius:var(--rad)}
.sw:hover{color:var(--red);background:var(--line2)}
select{background:var(--panel);border:1px solid var(--line);border-radius:var(--rad);padding:4px 7px;font-size:.8rem}

@media (max-width:820px){
  #shell{grid-template-columns:1fr}
  #rail{border-right:0;border-bottom:1px solid var(--line)}
  #brand::after{display:none}
  nav{flex-direction:row;overflow-x:auto;padding:0}
  nav button{border-left:0;border-bottom:3px solid transparent;white-space:nowrap;width:auto;padding:9px 13px}
  nav button[aria-current="true"]{border-left-color:transparent;border-bottom-color:var(--red)}
  nav button .n{display:none}
  #railfoot{border-top:1px solid var(--line)}
  #wrap{padding:18px 16px}
  .stage{padding:20px 16px}
  .grades{grid-template-columns:repeat(2,1fr)}
  .choices{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="shell">
  <aside id="rail">
    <div id="brand">
      <h1>Русский<br>Тренажёр</h1>
      <div class="sub">A1 · speaking track</div>
    </div>
    <nav id="nav"></nav>
    <div id="railfoot">
      <button class="sw" id="themebtn" title="Toggle theme">◐</button>
      <select id="rate" title="Speech speed">
        <option value="0.7">0.7×</option><option value="0.85" selected>0.85×</option>
        <option value="1">1.0×</option><option value="1.15">1.15×</option>
      </select>
      <button class="btn ghost sm" id="resetbtn">Reset</button>
    </div>
  </aside>

  <main>
    <div id="topbar">
      <div class="stat"><span class="k">Due now</span><span class="v hot" id="s-due">0</span></div>
      <div class="stat"><span class="k">Known</span><span class="v" id="s-known">0</span></div>
      <div class="stat"><span class="k">Streak</span><span class="v" id="s-streak">0</span></div>
      <div class="stat"><span class="k">Accuracy</span><span class="v" id="s-acc">—</span></div>
      <div class="stat"><span class="k">Decode</span><span class="v" id="s-dec">—</span></div>
      <div id="voicewarn"></div>
    </div>
    <div id="wrap">
      <section class="panel" id="p-today"></section>
      <section class="panel" id="p-decode"></section>
      <section class="panel" id="p-cards"></section>
      <section class="panel" id="p-patterns"></section>
      <section class="panel" id="p-verbs"></section>
      <section class="panel" id="p-cases"></section>
      <section class="panel" id="p-dialog"></section>
      <section class="panel" id="p-sprint"></section>
      <section class="panel" id="p-errors"></section>
      <section class="panel" id="p-course"></section>
    </div>
  </main>
</div>

<script>
"use strict";
/* ══════════════════ DATA ══════════════════ */

/* Sentence deck. t = topic tag, tier 1 = survival core, 2 = conversation, 3 = personal interest */
const DECK = [
/* survival */
{id:1,ru:"Приве́т",en:"Hi (informal)",t:"greet",tier:1},
{id:2,ru:"Здра́вствуйте",en:"Hello (formal, to anyone you'd call Вы)",t:"greet",tier:1,note:"The first в is silent: ZDRAST-vuy-tye."},
{id:3,ru:"Как дела́?",en:"How are you?",t:"greet",tier:1},
{id:4,ru:"Всё хорошо́, спаси́бо",en:"Everything's good, thanks",t:"greet",tier:1},
{id:5,ru:"Норма́льно",en:"Fine / OK (the default honest answer)",t:"greet",tier:1},
{id:6,ru:"Как тебя́ зову́т?",en:"What's your name? (informal)",t:"greet",tier:1,note:"Literally: how do they call you."},
{id:7,ru:"Меня́ зову́т…",en:"My name is…",t:"greet",tier:1},
{id:8,ru:"О́чень прия́тно",en:"Nice to meet you",t:"greet",tier:1},
{id:9,ru:"Отку́да ты?",en:"Where are you from?",t:"greet",tier:1},
{id:10,ru:"Я из Гре́ции",en:"I'm from Greece",t:"greet",tier:1,note:"из + genitive. Гре́ция → Гре́ции."},
{id:11,ru:"Я живу́ в Афи́нах",en:"I live in Athens",t:"greet",tier:1},
{id:12,ru:"Я не понима́ю",en:"I don't understand",t:"survive",tier:1},
{id:13,ru:"Повтори́те, пожа́луйста",en:"Please repeat (formal)",t:"survive",tier:1},
{id:14,ru:"Говори́ ме́дленнее",en:"Speak slower (informal)",t:"survive",tier:1},
{id:15,ru:"Что э́то зна́чит?",en:"What does this mean?",t:"survive",tier:1},
{id:16,ru:"Как по-ру́сски «coffee»?",en:"How do you say “coffee” in Russian?",t:"survive",tier:1},
{id:17,ru:"Извини́те, пожа́луйста",en:"Excuse me, please",t:"survive",tier:1},
{id:18,ru:"Ско́лько э́то сто́ит?",en:"How much does this cost?",t:"survive",tier:1},
{id:19,ru:"Где здесь метро́?",en:"Where's the metro around here?",t:"survive",tier:1},
{id:20,ru:"Мо́жешь помо́чь?",en:"Can you help? (informal)",t:"survive",tier:1},
{id:21,ru:"До свида́ния",en:"Goodbye (neutral/formal)",t:"greet",tier:1},
{id:22,ru:"Пока́!",en:"Bye! (informal)",t:"greet",tier:1},
{id:23,ru:"Споко́йной но́чи",en:"Good night",t:"greet",tier:1},
{id:24,ru:"Ничего́ стра́шного",en:"No problem / it's nothing",t:"survive",tier:1,note:"ничего́ is pronounced nee-chee-VO — г sounds like в here."},
/* быть & basic sentences */
{id:25,ru:"Э́то мой друг",en:"This is my friend (male)",t:"core",tier:1},
{id:26,ru:"Э́то моя́ подру́га",en:"This is my friend (female)",t:"core",tier:1},
{id:27,ru:"Он до́ктор",en:"He is a doctor",t:"core",tier:1,note:"No word for “is” in the present. Он [—] до́ктор."},
{id:28,ru:"Она́ о́чень у́мная",en:"She's very smart",t:"core",tier:2},
{id:29,ru:"Они́ до́ма",en:"They're at home",t:"core",tier:1},
{id:30,ru:"Я был в Москве́",en:"I was in Moscow (male speaker)",t:"core",tier:2,note:"Past tense agrees with gender: был / была́ / бы́ло / бы́ли."},
{id:31,ru:"Она́ была́ на рабо́те",en:"She was at work",t:"core",tier:2},
{id:32,ru:"Э́то бы́ло интере́сно",en:"That was interesting",t:"core",tier:2},
{id:33,ru:"За́втра я бу́ду до́ма",en:"Tomorrow I'll be home",t:"core",tier:2},
{id:34,ru:"Кто э́то?",en:"Who is that?",t:"core",tier:1},
/* power patterns */
{id:35,ru:"Я хочу́ есть",en:"I'm hungry (lit. I want to eat)",t:"pattern",tier:1},
{id:36,ru:"Я хочу́ ко́фе",en:"I want coffee",t:"pattern",tier:1,note:"ко́фе never changes its ending."},
{id:37,ru:"Что ты хо́чешь?",en:"What do you want?",t:"pattern",tier:1},
{id:38,ru:"Мне ну́жно рабо́тать",en:"I need to work",t:"pattern",tier:1,note:"Мне (dative) + ну́жно + infinitive. No “I” in the nominative here."},
{id:39,ru:"Мне на́до идти́",en:"I have to go",t:"pattern",tier:1},
{id:40,ru:"Мне нра́вится э́та пе́сня",en:"I like this song",t:"pattern",tier:1,note:"Literally: this song is pleasing to me. The song is the subject."},
{id:41,ru:"Мне нра́вится игра́ть в футбо́л",en:"I like playing football",t:"pattern",tier:2},
{id:42,ru:"Мне нра́вятся ру́сские фи́льмы",en:"I like Russian films",t:"pattern",tier:2,note:"Plural subject → нра́вятся."},
{id:43,ru:"Тебе́ нра́вится Москва́?",en:"Do you like Moscow?",t:"pattern",tier:2},
{id:44,ru:"У меня́ есть вопро́с",en:"I have a question",t:"pattern",tier:1,note:"Russian has no “to have”: at me there is a question."},
{id:45,ru:"У меня́ нет вре́мени",en:"I don't have time",t:"pattern",tier:1,note:"нет + genitive. вре́мя → вре́мени."},
{id:46,ru:"У тебя́ есть пла́ны на ве́чер?",en:"Do you have plans tonight?",t:"pattern",tier:2},
{id:47,ru:"Я могу́ помо́чь",en:"I can help",t:"pattern",tier:1},
{id:48,ru:"Я не могу́ сейча́с",en:"I can't right now",t:"pattern",tier:1},
{id:49,ru:"Я ду́маю, что э́то пра́вда",en:"I think that's true",t:"pattern",tier:2,note:"Russian keeps the comma before что — always."},
{id:50,ru:"Я не зна́ю, где он",en:"I don't know where he is",t:"pattern",tier:2},
{id:51,ru:"Я собира́юсь в спортза́л",en:"I'm heading to the gym",t:"pattern",tier:2},
{id:52,ru:"Я уже́ поза́втракал",en:"I already had breakfast",t:"pattern",tier:2},
{id:53,ru:"Я ещё не гото́в",en:"I'm not ready yet",t:"pattern",tier:2},
{id:54,ru:"Дава́й встре́тимся в шесть",en:"Let's meet at six",t:"pattern",tier:2},
{id:55,ru:"Мо́жно посмотре́ть?",en:"May I take a look?",t:"pattern",tier:2},

{s:"Мы говори́м о ___",base:"рабо́та",a:"рабо́те",c:"prepositional",why:"о (about) + prepositional."},
{s:"Я иду́ на ___",base:"рабо́та",a:"рабо́ту",c:"accusative",why:"на + accusative = motion towards. Work is a на-word, not a в-word."},

const KEY="ru-trainer-v1";
const DAY=864e5;
const today=()=>Math.floor(Date.now()/DAY);
const defaults=()=>({cards:{},dec:[],hist:[],streak:{last:null,n:0},checks:{},dlg:0,ver:1});
let S=defaults();

function load(){
  try{const r=localStorage.getItem(KEY); if(r){const p=JSON.parse(r); if(p&&p.ver===1) S=Object.assign(defaults(),p);} }catch(e){}
}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
function card(id){ if(!S.cards[id]) S.cards[id]={due:today(),iv:0,ease:2.5,reps:0,lapse:0,seen:0,wrong:0}; return S.cards[id]; }
function dueList(){ const t=today(); return DECK.filter(c=>{const m=S.cards[c.id]; return !m||m.due<=t;}); }
function knownCount(){ return Object.values(S.cards).filter(m=>m.iv>=7).length; }
function accuracy(){ const h=S.hist.slice(-60); if(!h.length) return null; return Math.round(100*h.filter(x=>x).length/h.length); }
function decodeAvg(){ if(S.dec.length<3) return null; const a=S.dec.slice(-40); return (a.reduce((x,y)=>x+y,0)/a.length/1000).toFixed(1); }
function logHit(ok){ S.hist.push(ok?1:0); if(S.hist.length>400) S.hist=S.hist.slice(-400); }
function touchStreak(){
  const t=today();
  if(S.streak.last===t) return;
  S.streak.n = (S.streak.last===t-1)? S.streak.n+1 : 1;
  S.streak.last=t; save();
}

/* SM-2 lite */
const IVS=[0,1,3,7,14,30,60,120];
function schedule(id,g){
  const m=card(id); m.reps++; m.seen++;
  if(g===0){ m.lapse++; m.wrong++; m.iv=0; m.ease=Math.max(1.4,m.ease-.2); m.due=today(); }
  else{
    if(g===1){ m.ease=Math.max(1.4,m.ease-.1); m.iv=Math.max(1,Math.round(Math.max(1,m.iv)*1.2)); }
    else if(g===2){ m.iv = m.iv? Math.round(m.iv*m.ease) : 1; }
    else { m.ease=Math.min(3.2,m.ease+.1); m.iv = m.iv? Math.round(m.iv*m.ease*1.35) : 3; }
    m.iv=Math.min(m.iv,180); m.due=today()+m.iv;
  }
  logHit(g>0); touchStreak(); save(); paintStats();
}
function nextIv(id,g){
  const m=card(id);
  if(g===0) return "now";
  if(g===1) return Math.max(1,Math.round(Math.max(1,m.iv)*1.2))+"d";
  if(g===2) return (m.iv?Math.round(m.iv*m.ease):1)+"d";
  return (m.iv?Math.round(m.iv*m.ease*1.35):3)+"d";
}

/* ══════════════════ HELPERS ══════════════════ */
const $=s=>document.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;};
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const plain=s=>s.replace(/́/g,"");
const shuffle=a=>{const b=a.slice(); for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];} return b;};
const pick=a=>a[Math.floor(Math.random()*a.length)];

function norm(s){
  return plain(String(s)).toLowerCase().replace(/ё/g,"е")
    .replace(/[.,!?;:"'«»()—–-]/g," ").replace(/\s+/g," ").trim();
}
function lev(a,b){
  const m=a.length,n=b.length; if(!m)return n; if(!n)return m;
  let prev=Array.from({length:n+1},(_,i)=>i),cur=new Array(n+1);
  for(let i=1;i<=m;i++){ cur[0]=i;
    for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
    [prev,cur]=[cur,prev];
  }
  return prev[n];
}
function judge(given,want){
  const g=norm(given),w=norm(want);
  if(!g) return "no";
  if(g===w) return "ok";
  return lev(g,w)<=Math.max(1,Math.floor(w.length*0.12)) ? "near" : "no";
}

/* speech */
let VOICE=null, RATE=.85;
function initVoice(){
  if(!("speechSynthesis" in window)){ $("#voicewarn").textContent="This browser has no speech synthesis — audio drills are text-only."; return; }
  const set=()=>{
    const vs=speechSynthesis.getVoices().filter(v=>/^ru/i.test(v.lang));
    VOICE=vs.find(v=>v.localService)||vs[0]||null;
    $("#voicewarn").textContent = VOICE ? "" : "No Russian voice installed — add a ru-RU voice in your OS settings for audio drills.";
  };
  set(); speechSynthesis.onvoiceschanged=set;
}
function speak(text){
  if(!("speechSynthesis" in window)) return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(plain(text));
    u.lang="ru-RU"; u.rate=RATE; if(VOICE)u.voice=VOICE;
    speechSynthesis.speak(u);
  }catch(e){}
}
function flash(node,ok){
  node.classList.remove("flash-ok","flash-no");
  void node.offsetWidth;
  node.classList.add(ok?"flash-ok":"flash-no");
  setTimeout(()=>node.classList.remove("flash-ok","flash-no"),700);
}
function speakBtn(text){ return `<button class="btn ghost sm" data-speak="${esc(text)}">▸ Слушать</button>`; }
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-speak]"); if(b) speak(b.getAttribute("data-speak"));
});

   <p class="lede">Five rounds, in this order: <b>1</b> play it whole, get the gist. <b>2</b> play again, catch specifics. <b>3</b> reconstruct lines from memory. <b>4</b> unblur the translation to check. <b>5</b> shadow — speak over the voice, same rhythm, same speed.</p>
   <div class="chips" id="dchips" style="margin-bottom:14px">
     ${DIALOGS.map((x,i)=>`<button class="chip" data-i="${i}" aria-pressed="${i===S.dlg%DIALOGS.length}">${x.title}</button>`).join("")}

     <span class="tagline">${esc(d.en)}</span>
   </div>
   <div class="dlg" id="dlines"></div>`;
  const box=$("#dlines");
  d.lines.forEach(([who,ru,en])=>{
    const l=el("div","line "+(who==="A"?"a":"b"),
      `<div class="who">${who}</div><div><div class="ru">${ru}</div><div class="tr hide">${esc(en)}</div>
       <button class="sp" data-speak="${esc(ru)}">▸ replay this line</button></div>`);
    l.querySelector(".tr").onclick=e=>e.target.classList.toggle("hide");
    box.appendChild(l);
  });
  $("#dchips").onclick=e=>{ const b=e.target.closest("[data-i]"); if(!b)return; S.dlg=+b.dataset.i; save(); RENDER.dialog(); };
  $("#dtr").onclick=()=>box.querySelectorAll(".tr").forEach(x=>x.classList.toggle("hide"));

};
function playAll(d){
  if(!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  d.lines.forEach(([w,ru],i)=>{
    const u=new SpeechSynthesisUtterance(plain(ru));
    u.lang="ru-RU"; u.rate=RATE; if(VOICE)u.voice=VOICE;
    u.onstart=()=>{
      const nodes=document.querySelectorAll("#dlines .line");
      nodes.forEach(n=>n.style.boxShadow="none");
      if(nodes[i]) nodes[i].style.boxShadow="inset 3px 0 0 var(--red)";
    };
    speechSynthesis.speak(u);
  });
}

/* ══════════════════ 08 · SPRINT ══════════════════ */
let spMode="trans",spQ=[],spI=0,spStart=0,spScore=0,spTimer=null,spLeft=60;
RENDER.sprint=()=>{
  const p=$("#p-sprint");
  p.innerHTML=`
   <div class="eyebrow">Module 08 · automaticity under pressure</div>
   <h2 class="sect">Спринт</h2>
   <p class="lede">Sixty seconds. Speed is the point — a correct sentence you needed eight seconds to build is not usable in a real conversation. Accept errors here; you are training retrieval latency, not accuracy.</p>
   <div class="chips" style="margin-bottom:14px" id="spchips">
     <button class="chip" data-m="trans" aria-pressed="true">Translation sprint (EN→RU, typed)</button>
     <button class="chip" data-m="rapid" aria-pressed="false">Rapid response (out loud)</button>
     <button class="chip" data-m="recall" aria-pressed="false">Recall sprint (RU→EN)</button>
   </div>
   <div class="stage" id="spstage">
     <div class="ru sm">Гото́в?</div>
     <div class="en">Pick a mode above, then start. The clock does not stop.</div>
     <div class="row" style="justify-content:center"><button class="btn red" id="spstart">Start 60s</button></div>
   </div>
   <div class="progress"><i id="spbar" style="width:100%"></i></div>
   <div class="row" style="margin-top:12px"><span class="tagline" id="spinfo"></span></div>`;
  $("#spchips").onclick=e=>{ const b=e.target.closest("[data-m]"); if(!b)return; spMode=b.dataset.m;
    Array.from($("#spchips").children).forEach(x=>x.setAttribute("aria-pressed",String(x===b))); };
  $("#spstart").onclick=spBegin;
};
function spBegin(){
  spQ = spMode==="rapid" ? shuffle(RAPID) : shuffle(DECK.filter(c=>c.tier<=2));
  spI=0; spScore=0; spLeft=60;
  clearInterval(spTimer);
  spTimer=setInterval(()=>{
    spLeft--; const b=$("#spbar"); if(b) b.style.width=(spLeft/60*100)+"%";
    const i=$("#spinfo"); if(i) i.textContent=`${spLeft}s · ${spScore} correct`;
    if(spLeft<=0) spEnd();
  },1000);
  spStep();
}
function spEnd(){
  clearInterval(spTimer); spTimer=null;
  const st=$("#spstage"); if(!st)return;
  const rate=(spScore/60*60).toFixed(0);
  st.innerHTML=`<div class="ru sm">Вре́мя!</div>
   <div class="en"><b class="mono" style="font-size:1.6rem;color:var(--red)">${spScore}</b> in 60 seconds — that's ${(60/Math.max(1,spScore)).toFixed(1)}s per item.</div>
   <div class="note">${spScore>=12?"Conversational speed. Move the difficulty up.":spScore>=7?"Getting there. Under 5s per item is where conversation starts working.":"Slow — but this is the metric that improves fastest with daily reps."}</div>
   <div class="row" style="justify-content:center"><button class="btn red" id="spagain">Go again</button></div>`;
  $("#spagain").onclick=spBegin;
  save(); paintStats();
}
function spStep(){
  const st=$("#spstage"); if(!st||spLeft<=0)return;
  if(spI>=spQ.length) spI=0;
  if(spMode==="rapid"){
    const [ru,en]=spQ[spI];
    st.innerHTML=`<div class="tagline">Answer out loud, full sentence</div>
      <div class="ru">${ru}</div>
      <div class="row" style="justify-content:center">${speakBtn(ru)}
        <button class="btn sm" id="spok">Said it ✓</button><button class="btn ghost sm" id="spno">Couldn't</button></div>
      <div class="en" style="opacity:.55;font-size:.85rem">${esc(en)}</div>`;
    speak(ru);
    $("#spok").onclick=()=>{spScore++;logHit(true);spI++;spStep();};
    $("#spno").onclick=()=>{logHit(false);spI++;spStep();};
  } else if(spMode==="recall"){
    const c=spQ[spI];
    st.innerHTML=`<div class="ru">${c.ru}</div>
      <div class="row" style="justify-content:center"><button class="btn sm" id="spok">Knew it ✓</button><button class="btn ghost sm" id="spno">Blank</button></div>`;
    $("#spok").onclick=()=>{spScore++;logHit(true);schedule(c.id,2);spI++;spStep();};
    $("#spno").onclick=()=>{logHit(false);schedule(c.id,0);spI++;spStep();};
  } else {
    const c=spQ[spI];
    st.innerHTML=`<div class="tagline">Type it in Russian — stress marks not needed</div>
      <div class="en" style="font-size:1.2rem">${esc(c.en)}</div>
      <div class="answerline"><input type="text" class="ru-in" id="spin" autocomplete="off" spellcheck="false"><button class="btn" id="spgo">↵</button></div>`;
    const inp=$("#spin");
    const go=()=>{
      const v=judge(inp.value,c.ru);
      if(v!=="no"){spScore++;logHit(true);schedule(c.id,v==="ok"?2:1);}
      else{logHit(false);schedule(c.id,0);}
      flash(st,v!=="no");
      if(v==="no"){
        st.insertAdjacentHTML("beforeend",`<div class="ru sm" style="color:var(--red)">${c.ru}</div>`);
        setTimeout(()=>{spI++;spStep();},1100);
      } else {spI++;spStep();}
    };
    $("#spgo").onclick=go;
    inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();go();}};
    inp.focus();
  }
}

/* ══════════════════ 09 · ERRORS ══════════════════ */
RENDER.errors=()=>{
  const p=$("#p-errors");
  const rows=DECK.map(c=>({c,m:S.cards[c.id]})).filter(x=>x.m&&x.m.lapse>0)
    .sort((a,b)=>b.m.lapse-a.m.lapse||a.m.iv-b.m.iv).slice(0,30);
  const byTopic={};
  DECK.forEach(c=>{const m=S.cards[c.id]; if(!m)return;
    byTopic[c.t]=byTopic[c.t]||{seen:0,lapse:0};
    byTopic[c.t].seen+=m.seen; byTopic[c.t].lapse+=m.lapse;});
  const weak=Object.entries(byTopic).filter(x=>x[1].seen>=4)
    .map(([k,v])=>({k,rate:v.lapse/v.seen,seen:v.seen})).sort((a,b)=>b.rate-a.rate);
  const label=k=>(TOPICS.find(t=>t[0]===k)||[k,k])[1];
  p.innerHTML=`
   <div class="eyebrow">Module 09 · what's actually broken</div>
   <h2 class="sect">Оши́бки</h2>
   <p class="lede">Built from your own misses, not from a generic list of learner mistakes. If a topic here shows above 30% lapse, stop advancing and repair it before adding new material.</p>
   <h3 style="font-size:.95rem;margin-bottom:8px">Weakest topics</h3>
   ${weak.length?`<div class="scroller"><table><thead><tr><th>Topic</th><th>Reps</th><th>Lapse rate</th><th>Verdict</th></tr></thead><tbody>
     ${weak.map(w=>`<tr><td><b>${label(w.k)}</b></td><td class="mono">${w.seen}</td><td class="mono">${Math.round(w.rate*100)}%</td>
       <td><span class="pill ${w.rate>.3?"crit":w.rate>.15?"warn":"good"}">${w.rate>.3?"repair now":w.rate>.15?"watch":"solid"}</span></td></tr>`).join("")}
   </tbody></table></div>`:`<p class="empty">No data yet — run a few card sessions and this fills in automatically.</p>`}
   <hr class="rule">
   <h3 style="font-size:.95rem;margin-bottom:8px">Leeches — items you keep forgetting</h3>
   ${rows.length?`<div class="scroller"><table><thead><tr><th>Card</th><th>Meaning</th><th>Lapses</th><th></th></tr></thead><tbody>
     ${rows.map(r=>`<tr><td class="ru sm" style="font-size:1rem;text-align:left">${r.c.ru}</td><td>${esc(r.c.en)}</td>
        <td class="mono">${r.m.lapse}</td><td>${speakBtn(r.c.ru)}</td></tr>`).join("")}
   </tbody></table></div>`:`<p class="empty">Nothing stuck yet. Cards you fail twice or more will appear here.</p>`}
   <hr class="rule">
   <div class="grid2">
     <div class="box"><h3>The four errors that will cost you most</h3>
       <p><b>1.</b> Using <span class="mono">идти́</span> when you're in a car — use <span class="mono">е́хать</span>.<br>
       <b>2.</b> Saying <span class="mono">Я нра́влюсь му́зыку</span> — it's <span class="mono">Мне нра́вится му́зыка</span>; the thing you like is the subject.<br>
       <b>3.</b> Forgetting the accusative on direct objects: <span class="mono">Я люблю́ Москву́</span>, not Москва́.<br>
       <b>4.</b> Reducing stressed о. Stress is the single loudest accent marker in Russian.</p></div>
     <div class="box"><h3>Session log</h3>
       <div class="kv"><span>Answers recorded</span><b class="mono">${S.hist.length}</b></div>
       <div class="kv"><span>Rolling accuracy (last 60)</span><b class="mono">${accuracy()==null?"—":accuracy()+"%"}</b></div>
       <div class="kv"><span>Cards in circulation</span><b class="mono">${Object.keys(S.cards).length}</b></div>
       <div class="kv"><span>Mature (7d+)</span><b class="mono">${knownCount()}</b></div>
       <div class="kv"><span>Decode average</span><b class="mono">${decodeAvg()?decodeAvg()+"s":"—"}</b></div>
     </div>
   </div>`;
};
